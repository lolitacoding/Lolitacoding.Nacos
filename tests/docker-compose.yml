# Docker Compose file used by the integration tests.
#
# Nacos 2.x and 3.x are both started so the test matrix can target either. The gRPC port is
# the main port + 1000 (9848), and the gRPC TLS port is the main port + 1001 (9849); both
# must be published or the client cannot subscribe to configuration and service changes.

services:
  nacos-2x:
    image: nacos/nacos-server:v2.5.1
    container_name: nacos-it-2x
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  nacos-3x:
    image: nacos/nacos-server:v3.0.2
    container_name: nacos-it-3x
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8858:8848"
      - "9858:9848"
      - "9859:9849"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  # Auth-enabled Nacos instance for the authentication integration tests.
  nacos-auth:
    image: nacos/nacos-server:v2.5.1
    container_name: nacos-it-auth
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8868:8848"
      - "9868:9848"
      - "9869:9849"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
