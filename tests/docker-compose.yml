# Docker Compose file for running Nacos locally while developing.
#
# The client targets Nacos 3.x only. The SDK gRPC port is the main port + 1000 (8848 -> 9848);
# it must be published or the client cannot subscribe to configuration and service changes.
# TLS is negotiated on that same gRPC port, so there is no separate TLS port to publish.
#
# Both instances run the newest stable 3.x release. The distributed lock's full semantics — lease
# renewal, the wait queue, explicit owners — belong to the 3.3 lock service, so point an instance at
# a 3.3 image (nacos/nacos-server:v3.3.0-RC for now) to exercise those; a 3.2 server only acquires
# and releases. The MCP registry the AI client speaks to arrived after the oldest 3.x release but
# before this one, so it works against these instances as they stand. See docs/faq.md.

services:
  nacos-3x:
    image: nacos/nacos-server:v3.2.4
    container_name: nacos-dev-3x
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.2 refuses to start without a signing key and identity even when the authentication
      # plugin is disabled, so both instances set them.
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  # Auth-enabled Nacos instance, for exercising the login flow.
  nacos-auth:
    image: nacos/nacos-server:v3.2.4
    container_name: nacos-dev-auth
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8868:8848"
      - "9868:9848"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
