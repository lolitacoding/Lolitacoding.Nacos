// Verbatim copy of the Nacos gRPC transport definition, taken from the official
// repository at https://github.com/alibaba/nacos (api/src/main/proto/nacos_grpc_service.proto).
// Licensed under Apache-2.0 by Alibaba Group Holding Ltd.; see NOTICE in the repository root.
//
// The protobuf envelope carries JSON-encoded message bodies inside google.protobuf.Any,
// so the two services below are the *only* protobuf definitions a client requires.
//
// SINGLE DOCUMENTED DEVIATION FROM UPSTREAM: the upstream file also imports
// "google/protobuf/timestamp.proto", but no message in this file references it, and protoc
// emits an "Import ... is unused" warning that this repository treats as an error. The
// import is therefore omitted here. It has no effect on the wire format: no field, message
// or service in this contract uses google.protobuf.Timestamp.

syntax = "proto3";

import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_package = "com.alibaba.nacos.api.grpc.auto";
option csharp_namespace = "Lolitacoding.Nacos.Protocol.Generated";

message Metadata {
  string type = 3;
  string clientIp = 8;
  map<string, string> headers = 7;
}

message Payload {
  Metadata metadata = 2;
  google.protobuf.Any body = 3;
}

service Request {
  // Sends a commonRequest
  rpc request (Payload) returns (Payload) {
  }
}

service BiRequestStream {
  // Sends a biStreamRequest
  rpc requestBiStream (stream Payload) returns (stream Payload) {
  }
}
