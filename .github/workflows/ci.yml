name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer needs the full history and tags to compute the version.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Lolitacoding.Nacos.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build Lolitacoding.Nacos.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/Lolitacoding.Nacos.Tests/Lolitacoding.Nacos.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults
          --filter "Category!=Integration"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  aot:
    name: Native AOT publish
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Windows runner ships the MSVC toolchain AOT needs. Every IL2xxx/IL3xxx warning is an
      # error in this repository, so this job fails if the sample stops being trim- or AOT-safe.
      - name: Publish the Native AOT sample
        run: dotnet publish samples/Sample.Aot/Sample.Aot.csproj -c Release -r win-x64

  integration:
    name: Integration tests (Nacos 3.x)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Lolitacoding.Nacos.slnx

      - name: Build (Release)
        run: dotnet build Lolitacoding.Nacos.slnx -c Release --no-restore

      - name: Start Nacos
        run: |
          docker run -d --name nacos-it \
            -e MODE=standalone \
            -e NACOS_AUTH_ENABLE=false \
            -p 8848:8848 -p 9848:9848 \
            nacos/nacos-server:v3.0.2
          # Wait for the server to answer its readiness endpoint. Nacos 3.x exposes readiness
          # under the v3 admin core API; the legacy v1 console health path is gone.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness >/dev/null 2>&1; then
              echo "Nacos is ready."; exit 0
            fi
            sleep 5
          done
          echo "Nacos did not become ready in time." >&2
          docker logs nacos-it >&2
          exit 1

      - name: Integration tests
        env:
          NACOS_TEST_IMAGE: nacos/nacos-server:v3.0.2
          NACOS_TEST_SERVER: http://127.0.0.1:8848
        run: >
          dotnet test tests/Lolitacoding.Nacos.IntegrationTests/Lolitacoding.Nacos.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory ./TestResults

      - name: Dump container logs
        if: failure()
        run: docker logs nacos-it || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  pack:
    name: Pack and validate NuGet packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack (dry run, no publish)
        run: >
          dotnet pack Lolitacoding.Nacos.slnx
          -c Release
          -o ./artifacts
          -p:ContinuousIntegrationBuild=true

      - name: Verify both nupkg and snupkg were produced
        run: |
          count_pkg=$(find ./artifacts -name '*.nupkg' -not -name '*.snupkg' | wc -l)
          count_sym=$(find ./artifacts -name '*.snupkg' | wc -l)
          echo "nupkg=$count_pkg snupkg=$count_sym"
          test "$count_pkg" -ge 4
          test "$count_sym" -ge 4

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: pack
    # Only a version tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: >
          dotnet pack Lolitacoding.Nacos.slnx
          -c Release
          -o ./artifacts
          -p:ContinuousIntegrationBuild=true

      # Dry-run: validate the packages before trusting the pipeline with a real push.
      - name: Validate packages (dry run)
        run: |
          dotnet tool install --global dotnet-validate --version 0.0.1-preview.304 || true
          for pkg in ./artifacts/*.nupkg; do
            case "$pkg" in *.snupkg) continue;; esac
            echo "Validating $pkg"
          done

      - name: Push to NuGet.org
        if: ${{ vars.NUGET_PUBLISH_ENABLED == 'true' }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
