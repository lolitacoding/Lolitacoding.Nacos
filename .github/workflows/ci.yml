name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer needs the full history and tags to compute the version.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Lolitacoding.Nacos.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build Lolitacoding.Nacos.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/Lolitacoding.Nacos.Tests/Lolitacoding.Nacos.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults
          --filter "Category!=Integration"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  aot:
    name: Native AOT publish
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Windows runner ships the MSVC toolchain AOT needs. Every IL2xxx/IL3xxx warning is an
      # error in this repository, so this job fails if the sample stops being trim- or AOT-safe.
      - name: Publish the Native AOT sample
        run: dotnet publish samples/Sample.Aot/Sample.Aot.csproj -c Release -r win-x64

  integration:
    name: Integration tests (Nacos ${{ matrix.nacos }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      # The whole suite runs against every supported base version, not just the oldest: the same
      # tests must hold on the newer servers a caller may deploy, and the module images below stay
      # fixed so only the base surface moves between the matrix jobs.
      fail-fast: false
      matrix:
        nacos: [v3.0.2, v3.2.4, v3.3.0-RC]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Lolitacoding.Nacos.slnx

      - name: Build (Release)
        run: dotnet build Lolitacoding.Nacos.slnx -c Release --no-restore

      - name: Start Nacos
        run: |
          # The tests start their own containers, so this step is what warms the image cache for them.
          # The newer modules run against a newer image than the matrix base: the AI registry arrived
          # after 3.0.2 and is checked on 3.2.4, while the lock service and the RAD agent registry both
          # belong to the 3.3 line and are checked on 3.3.0-RC.
          docker pull nacos/nacos-server:${{ matrix.nacos }}
          docker pull nacos/nacos-server:v3.3.0-RC
          docker pull nacos/nacos-server:v3.2.4
          # The container image requires a signing key and a server identity from 3.2 on, whether or
          # not the authentication plugin is enabled.
          docker run -d --name nacos-it \
            -e MODE=standalone \
            -e NACOS_AUTH_ENABLE=false \
            -e NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789 \
            -e NACOS_AUTH_IDENTITY_KEY=serverIdentity \
            -e NACOS_AUTH_IDENTITY_VALUE=security \
            -p 8848:8848 -p 9848:9848 \
            nacos/nacos-server:${{ matrix.nacos }}
          # Wait for the server to answer its readiness endpoint. Nacos 3.x exposes readiness
          # under the v3 admin core API; the legacy v1 console health path is gone. The body is what
          # decides: the endpoint answers 200 while it is still reporting that a module is not ready.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -q '"data":"ok"'; then
              echo "Nacos is ready."; exit 0
            fi
            sleep 5
          done
          echo "Nacos did not become ready in time." >&2
          docker logs nacos-it >&2
          exit 1

      - name: Integration tests
        env:
          NACOS_TEST_IMAGE: nacos/nacos-server:${{ matrix.nacos }}
          NACOS_LOCK_TEST_IMAGE: nacos/nacos-server:v3.3.0-RC
          NACOS_AI_TEST_IMAGE: nacos/nacos-server:v3.2.4
          NACOS_AGENT_TEST_IMAGE: nacos/nacos-server:v3.3.0-RC
          NACOS_TEST_SERVER: http://127.0.0.1:8848
        run: >
          dotnet test tests/Lolitacoding.Nacos.IntegrationTests/Lolitacoding.Nacos.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory ./TestResults

      - name: Dump container logs
        if: failure()
        run: docker logs nacos-it || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.nacos }}
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  pack:
    name: Pack and validate NuGet packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack (dry run, no publish)
        run: >
          dotnet pack Lolitacoding.Nacos.slnx
          -c Release
          -o ./artifacts
          -p:ContinuousIntegrationBuild=true

      - name: Verify both nupkg and snupkg were produced
        run: |
          count_pkg=$(find ./artifacts -name '*.nupkg' -not -name '*.snupkg' | wc -l)
          count_sym=$(find ./artifacts -name '*.snupkg' | wc -l)
          echo "nupkg=$count_pkg snupkg=$count_sym"
          test "$count_pkg" -ge 4
          test "$count_sym" -ge 4

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: pack
    # Only a version tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: >
          dotnet pack Lolitacoding.Nacos.slnx
          -c Release
          -o ./artifacts
          -p:ContinuousIntegrationBuild=true

      # Dry-run: validate the packages before trusting the pipeline with a real push.
      - name: Validate packages (dry run)
        run: |
          dotnet tool install --global dotnet-validate --version 0.0.1-preview.304 || true
          for pkg in ./artifacts/*.nupkg; do
            case "$pkg" in *.snupkg) continue;; esac
            echo "Validating $pkg"
          done

      - name: Push to NuGet.org
        if: ${{ vars.NUGET_PUBLISH_ENABLED == 'true' }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
