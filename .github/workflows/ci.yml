name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Every job only reads the repository; the publish job widens this for the OIDC token.
permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run irrelevant, but a tag is a release
  # decision: never cancel one that may already be publishing.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer needs the full history and tags to compute the version.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Lolitacoding.Nacos.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build Lolitacoding.Nacos.slnx -c Release --no-restore

      - name: Unit tests
        # Microsoft.Testing.Platform rejects VSTest's --logger switch: the test app exits before
        # completing the handshake and the step reports "Zero tests ran". The xUnit TRX reporter
        # is the MTP-native equivalent.
        run: >
          dotnet test tests/Lolitacoding.Nacos.Tests/Lolitacoding.Nacos.Tests.csproj
          -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename unit-tests.trx
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  aot:
    name: Native AOT publish
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Windows runner ships the MSVC toolchain AOT needs. Every IL2xxx/IL3xxx warning is an
      # error in this repository, so this job fails if the sample stops being trim- or AOT-safe.
      - name: Publish the Native AOT sample
        run: dotnet publish samples/Sample.Aot/Sample.Aot.csproj -c Release -r win-x64

  # The suite is split by the image a test class needs rather than run as one job against one
  # server: the base surface moves between matrix jobs, while the AI registry and the 3.3 modules
  # are pinned to the first release that served them and only need to be checked once. Each job
  # therefore pulls only the image its classes start, and selects those classes with
  # --filter-class, which is the MTP-native way to name a class (the VSTest --filter syntax is not
  # understood by the Microsoft.Testing.Platform runner).
  integration:
    name: Integration tests (Nacos ${{ matrix.nacos }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      # The whole base suite runs against every supported 3.x release, not just the oldest: the
      # same tests must hold on the newer servers a caller may deploy.
      fail-fast: false
      matrix:
        nacos: [v3.0.2, v3.2.4, v3.3.0-RC]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Lolitacoding.Nacos.slnx

      - name: Build (Release)
        run: dotnet build Lolitacoding.Nacos.slnx -c Release --no-restore

      - name: Warm the image cache
        # The tests start their own containers, so this step is what keeps the pull off the
        # critical path of the first test that needs the image.
        run: docker pull nacos/nacos-server:${{ matrix.nacos }}

      - name: Integration tests
        env:
          NACOS_TEST_IMAGE: nacos/nacos-server:${{ matrix.nacos }}
          NO_PROXY: localhost,127.0.0.1
        run: >
          dotnet test tests/Lolitacoding.Nacos.IntegrationTests/Lolitacoding.Nacos.IntegrationTests.csproj
          -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename integration-v3.trx
          --results-directory ./TestResults
          --filter-class Lolitacoding.Nacos.IntegrationTests.AddressServerIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.AuthIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.ConfigIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.NamingIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.TransportIntegrationTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.nacos }}
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  integration-ai:
    name: Integration tests (AI registry, Nacos v3.2.4)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Lolitacoding.Nacos.slnx

      - name: Build (Release)
        run: dotnet build Lolitacoding.Nacos.slnx -c Release --no-restore

      - name: Warm the image cache
        # The AI registry is younger than the oldest base server: a 3.0.2 server has no handler for
        # it, so this job is pinned to the release that first served the whole contract.
        run: docker pull nacos/nacos-server:v3.2.4

      - name: Integration tests
        env:
          NACOS_AI_TEST_IMAGE: nacos/nacos-server:v3.2.4
          NO_PROXY: localhost,127.0.0.1
        run: >
          dotnet test tests/Lolitacoding.Nacos.IntegrationTests/Lolitacoding.Nacos.IntegrationTests.csproj
          -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename integration-ai.trx
          --results-directory ./TestResults
          --filter-class Lolitacoding.Nacos.IntegrationTests.AgentCardIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.AgentSpecIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.AIIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.AILocalCacheIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.PromptIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.SkillIntegrationTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-ai
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  integration-agent:
    name: Integration tests (agent registry and lock, Nacos v3.3.0-RC)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Lolitacoding.Nacos.slnx

      - name: Build (Release)
        run: dotnet build Lolitacoding.Nacos.slnx -c Release --no-restore

      - name: Warm the image cache
        # The RAD agent handlers and the renewing lock service are both @Since("3.3.0"), so this job
        # runs on the 3.3 line only, where a release candidate is what is published so far.
        run: docker pull nacos/nacos-server:v3.3.0-RC

      - name: Integration tests
        env:
          NACOS_AGENT_TEST_IMAGE: nacos/nacos-server:v3.3.0-RC
          NACOS_LOCK_TEST_IMAGE: nacos/nacos-server:v3.3.0-RC
          NO_PROXY: localhost,127.0.0.1
        run: >
          dotnet test tests/Lolitacoding.Nacos.IntegrationTests/Lolitacoding.Nacos.IntegrationTests.csproj
          -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename integration-agent.trx
          --results-directory ./TestResults
          --filter-class Lolitacoding.Nacos.IntegrationTests.AgentRegistryIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.AgentWatchIntegrationTests
          --filter-class Lolitacoding.Nacos.IntegrationTests.LockingIntegrationTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-agent
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  pack:
    name: Pack and validate NuGet packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Pack (dry run, no publish)
        run: >
          dotnet pack Lolitacoding.Nacos.slnx
          -c Release
          -o ./artifacts
          -p:ContinuousIntegrationBuild=true

      - name: Validate the packages
        # A real check of what the publish job is about to push: exactly the seven libraries, each
        # with its symbols, its README, its nuspec and its net11.0 assembly. An empty or partial
        # artifacts directory must fail here rather than at the feed.
        run: |
          count_pkg=$(find ./artifacts -maxdepth 1 -name '*.nupkg' | wc -l)
          count_sym=$(find ./artifacts -maxdepth 1 -name '*.snupkg' | wc -l)
          echo "nupkg=$count_pkg snupkg=$count_sym"
          test "$count_pkg" -eq 7
          test "$count_sym" -eq 7

          for assembly in \
            Lolitacoding.Nacos \
            Lolitacoding.Nacos.AspNetCore \
            Lolitacoding.Nacos.Extensions.Configuration \
            Lolitacoding.Nacos.Extensions.DependencyInjection \
            Lolitacoding.Nacos.Extensions.ServiceDiscovery \
            Lolitacoding.Aspire.Hosting.Nacos \
            Lolitacoding.Aspire.Nacos; do
            pkg=$(find ./artifacts -maxdepth 1 -name "$assembly.[0-9]*.nupkg" -print -quit)
            test -n "$pkg" || { echo "$assembly: no package was produced"; exit 1; }
            find ./artifacts -maxdepth 1 -name "$assembly.[0-9]*.snupkg" | grep -q . \
              || { echo "$assembly: no symbol package was produced"; exit 1; }
            # -Z1 lists the entry names alone, so each check is an exact match rather than a
            # substring that another package's path could satisfy.
            unzip -Z1 "$pkg" > entries.txt
            grep -qx "lib/net11.0/$assembly.dll" entries.txt \
              || { echo "$assembly: $pkg has no lib/net11.0/$assembly.dll"; exit 1; }
            grep -qx "README.md" entries.txt \
              || { echo "$assembly: $pkg has no README.md"; exit 1; }
            grep -qx "$assembly.nuspec" entries.txt \
              || { echo "$assembly: $pkg has no nuspec"; exit 1; }
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    # A tag publishes, but only once every gate has passed and the feed is switched on.
    needs: [pack, integration, integration-ai, integration-agent, aot]
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_PUBLISH_ENABLED == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      # The packages are the ones the pack job already validated; re-packing here would publish
      # something no job has looked at.
      - name: Download the validated packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
